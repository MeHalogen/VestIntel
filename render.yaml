databases:
  - name: vestintel-db
    databaseName: vestintel
    user: vestintel
    plan: free

services:
  # ── Redis ────────────────────────────────────────────────────────────────
  - type: redis
    name: vestintel-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  - type: web
    name: vestintel-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vestintel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: vestintel-redis
          type: redis
          property: connectionString
      - key: TWELVEDATA_API_KEY
        sync: false          # set manually in Render dashboard
      - key: NEWS_API_KEY
        sync: false          # set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: NSE_CYCLE_SECONDS
        value: "60"
      - key: NSE_CACHE_TTL
        value: "120"
      - key: DISABLE_WORKERS
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "https://vestintel.netlify.app,http://localhost:3000,http://localhost:3001"
